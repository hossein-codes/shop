<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1210" viewBox="0 0 1080 1210" font-family="Vazirmatn, 'Segoe UI', Tahoma, sans-serif">
  <defs>
    <style>
      .t { fill: #141414; }
      .m { fill: #8A8781; }
    </style>
  </defs>

  <!-- پس‌زمینه -->
  <rect width="1080" height="1210" fill="#FFFFFF"/>

  <!-- عنوان -->
  <text x="1056" y="52" text-anchor="end" font-size="24" font-weight="800" class="t">پالت رنگی نَخ — NAKH Color Tokens</text>
  <text x="1056" y="76" text-anchor="end" font-size="13" class="m">Design System v1.0 — Direction A: Gallery Minimal (تمام هگزها قطعی و پیاده‌سازی‌شده‌اند)</text>
  <line x1="24" y1="92" x2="1056" y2="92" stroke="#E6E2DB" stroke-width="1"/>

  <!-- ============ ردیف ۱: مبانی ============ -->
  <text x="1056" y="124" text-anchor="end" font-size="14" font-weight="700" class="t">۱ — مبانی (Foundation)</text>

  <g transform="translate(816,136)">
    <rect width="240" height="110" fill="#FAFAF8" stroke="#D4CFC6" stroke-width="1"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">صدفی — پس‌زمینه اصلی</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">bg / #FAFAF8</text>
  </g>
  <g transform="translate(552,136)">
    <rect width="240" height="110" fill="#FFFFFF" stroke="#D4CFC6" stroke-width="1"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">سفید — سطح کارت‌ها</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">surface / #FFFFFF</text>
  </g>
  <g transform="translate(288,136)">
    <rect width="240" height="110" fill="#F3F0EA" stroke="#D4CFC6" stroke-width="1"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">کتان — بلوک ثانویه</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">surface-alt / #F3F0EA</text>
  </g>
  <g transform="translate(24,136)">
    <rect width="240" height="110" fill="#1A1917"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">بوم تیره — فوتر/هیرو</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">canvas-dark / #1A1917</text>
  </g>

  <!-- ============ ردیف ۲: متن و خطوط ============ -->
  <text x="1056" y="324" text-anchor="end" font-size="14" font-weight="700" class="t">۲ — متن و خطوط (Ink &amp; Line)</text>

  <g transform="translate(816,336)">
    <rect width="240" height="110" fill="#141414"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">مرکب ۹۰۰ — متن اصلی</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">ink / #141414</text>
  </g>
  <g transform="translate(552,336)">
    <rect width="240" height="110" fill="#5C5A56"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">مرکب ۶۰۰ — متن ثانویه</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">ink-2 / #5C5A56</text>
  </g>
  <g transform="translate(288,336)">
    <rect width="240" height="110" fill="#8A8781"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">مرکب ۴۰۰ — متا/جانشین</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">ink-3 / #8A8781</text>
  </g>
  <g transform="translate(24,336)">
    <rect width="240" height="110" fill="#E6E2DB" stroke="#D4CFC6" stroke-width="1"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">خط — حاشیه و جداکننده</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">line / #E6E2DB</text>
  </g>

  <!-- ============ ردیف ۳: برند ============ -->
  <text x="1056" y="524" text-anchor="end" font-size="14" font-weight="700" class="t">۳ — برند (Primary &amp; Accent)</text>

  <g transform="translate(816,536)">
    <rect width="240" height="110" fill="#141414"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">مرکب — رنگ اصلی برند و CTA</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">brand / #141414</text>
  </g>
  <g transform="translate(552,536)">
    <rect width="240" height="110" fill="#C8B49A"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">شنی — لهجه برند</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">accent / #C8B49A</text>
  </g>
  <g transform="translate(288,536)">
    <rect width="240" height="110" fill="#A98F6F"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">شنی پررنگ — لهجه قوی</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">accent-deep / #A98F6F</text>
  </g>
  <g transform="translate(24,536)">
    <rect width="240" height="110" fill="#B08A3E"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">کهربایی — ستاره امتیاز</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">star / #B08A3E</text>
  </g>

  <!-- ============ ردیف ۴: معنایی ============ -->
  <text x="1056" y="724" text-anchor="end" font-size="14" font-weight="700" class="t">۴ — معنایی (Semantic)</text>

  <g transform="translate(816,736)">
    <rect width="240" height="110" fill="#B4433A"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">آجری — تخفیف / خطا</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">brick / #B4433A</text>
  </g>
  <g transform="translate(552,736)">
    <rect width="240" height="110" fill="#2F7A4C"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">کاج — موفقیت</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">pine / #2F7A4C</text>
  </g>
  <g transform="translate(288,736)">
    <rect width="240" height="110" fill="#9A6B2F"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">اخرایی — هشدار / موجودی کم</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">ochre / #9A6B2F</text>
  </g>
  <g transform="translate(24,736)">
    <rect width="240" height="110" fill="#3F5B6B"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">لایی — اطلاعات</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">slate / #3F5B6B</text>
  </g>

  <!-- ============ ردیف ۵: تینت‌های نرم ============ -->
  <text x="1056" y="924" text-anchor="end" font-size="14" font-weight="700" class="t">۵ — تینت‌های نرم (Soft Backgrounds)</text>

  <g transform="translate(816,936)">
    <rect width="240" height="110" fill="#F7E9E7" stroke="#D4CFC6" stroke-width="1"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">آجری نرم — پس‌زمینه تخفیف</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">brick-soft / #F7E9E7</text>
  </g>
  <g transform="translate(552,936)">
    <rect width="240" height="110" fill="#E8F3EC" stroke="#D4CFC6" stroke-width="1"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">کاج نرم — پیام موفقیت</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">pine-soft / #E8F3EC</text>
  </g>
  <g transform="translate(288,936)">
    <rect width="240" height="110" fill="#F7EFDF" stroke="#D4CFC6" stroke-width="1"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">اخرایی نرم — هشدار ملایم</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">ochre-soft / #F7EFDF</text>
  </g>
  <g transform="translate(24,936)">
    <rect width="240" height="110" fill="#E9EFF3" stroke="#D4CFC6" stroke-width="1"/>
    <rect y="110" width="240" height="40" fill="#FFFFFF"/>
    <text x="228" y="128" text-anchor="end" font-size="13" font-weight="600" class="t">لایی نرم — اطلاع‌رسانی</text>
    <text x="228" y="144" text-anchor="end" font-size="11" font-family="monospace" class="m">slate-soft / #E9EFF3</text>
  </g>

  <!-- پانویس -->
  <line x1="24" y1="1112" x2="1056" y2="1112" stroke="#E6E2DB" stroke-width="1"/>
  <text x="1056" y="1140" text-anchor="end" font-size="12" class="m">قاعده ۶۰/۳۰/۱۰ — ۶۰٪ صدفی و سفید · ۳۰٪ مرکب (متن/تصویر) · ۱۰٪ لهجه (شنی + آجری به‌ندرت)</text>
  <text x="1056" y="1162" text-anchor="end" font-size="12" class="m">شنی و شنی‌پررنگ هرگز برای متن بدنه استفاده نمی‌شوند — فقط سطح و المان تزئینی با متن مرکب</text>
</svg>
