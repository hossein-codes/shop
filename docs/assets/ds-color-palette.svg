<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1210" viewBox="0 0 1080 1210" font-family="Vazirmatn, 'Segoe UI', Tahoma, sans-serif">
  <defs>
    <style>
      .t { fill: #102A43; }
      .m { fill: #829AB1; }
      .card { stroke: #D9E4EC; stroke-width: 1; }
      .hex { font-size: 12px; fill: #52667A; font-family: monospace; }
      .name { font-size: 14px; font-weight: 700; fill: #102A43; }
    </style>
  </defs>

  <!-- پس‌زمینه -->
  <rect width="1080" height="1210" fill="#FFFFFF"/>

  <!-- عنوان -->
  <text x="1056" y="52" text-anchor="end" font-size="24" font-weight="800" class="t">پالت رنگی نَخ — NAKH Color Tokens</text>
  <text x="1056" y="76" text-anchor="end" font-size="13" class="m">Design System v3.0 — Ocean Palette (sRGB)</text>

  <!-- ردیف ۱: برند -->
  <text x="1056" y="120" text-anchor="end" font-size="16" font-weight="700" class="t">برند — Brand</text>
  <g>
    <rect x="824" y="136" width="232" height="120" rx="16" fill="#006B9F" class="card"/>
    <text x="1040" y="286" text-anchor="end" class="name">brand</text>
    <text x="1040" y="304" text-anchor="end" class="hex">#006B9F</text>

    <rect x="576" y="136" width="232" height="120" rx="16" fill="#00577F" class="card"/>
    <text x="792" y="286" text-anchor="end" class="name">brand-hover</text>
    <text x="792" y="304" text-anchor="end" class="hex">#00577F</text>

    <rect x="328" y="136" width="232" height="120" rx="16" fill="#72C6E8" class="card"/>
    <text x="544" y="286" text-anchor="end" class="name">brand-2</text>
    <text x="544" y="304" text-anchor="end" class="hex">#72C6E8</text>

    <rect x="80" y="136" width="232" height="120" rx="16" fill="#082F49" class="card"/>
    <text x="296" y="286" text-anchor="end" class="name">canvas-dark</text>
    <text x="296" y="304" text-anchor="end" class="hex">#082F49</text>
  </g>

  <!-- ردیف ۲: مبانی -->
  <text x="1056" y="360" text-anchor="end" font-size="16" font-weight="700" class="t">مبانی — Neutrals</text>
  <g>
    <rect x="824" y="376" width="232" height="100" rx="16" fill="#FAF9F6" class="card"/>
    <text x="1040" y="506" text-anchor="end" class="name">bg</text>
    <text x="1040" y="524" text-anchor="end" class="hex">#FAF9F6</text>

    <rect x="576" y="376" width="232" height="100" rx="16" fill="#FFFFFF" class="card"/>
    <text x="792" y="506" text-anchor="end" class="name">surface</text>
    <text x="792" y="524" text-anchor="end" class="hex">#FFFFFF</text>

    <rect x="328" y="376" width="232" height="100" rx="16" fill="#F3F7FA" class="card"/>
    <text x="544" y="506" text-anchor="end" class="name">surface-alt</text>
    <text x="544" y="524" text-anchor="end" class="hex">#F3F7FA</text>

    <rect x="80" y="376" width="232" height="100" rx="16" fill="#D9E4EC" class="card"/>
    <text x="296" y="506" text-anchor="end" class="name">line</text>
    <text x="296" y="524" text-anchor="end" class="hex">#D9E4EC</text>
  </g>

  <!-- ردیف ۳: متن -->
  <text x="1056" y="580" text-anchor="end" font-size="16" font-weight="700" class="t">متن — Text</text>
  <g>
    <rect x="824" y="596" width="232" height="100" rx="16" fill="#102A43" class="card"/>
    <text x="1040" y="726" text-anchor="end" class="name">ink</text>
    <text x="1040" y="744" text-anchor="end" class="hex">#102A43</text>

    <rect x="576" y="596" width="232" height="100" rx="16" fill="#52667A" class="card"/>
    <text x="792" y="726" text-anchor="end" class="name">ink-2</text>
    <text x="792" y="744" text-anchor="end" class="hex">#52667A</text>

    <rect x="328" y="596" width="232" height="100" rx="16" fill="#829AB1" class="card"/>
    <text x="544" y="726" text-anchor="end" class="name">ink-3</text>
    <text x="544" y="744" text-anchor="end" class="hex">#829AB1</text>

    <rect x="80" y="596" width="232" height="100" rx="16" fill="#BCCCDC" class="card"/>
    <text x="296" y="726" text-anchor="end" class="name">line-strong</text>
    <text x="296" y="744" text-anchor="end" class="hex">#BCCCDC</text>
  </g>

  <!-- ردیف ۴: لهجه طلایی -->
  <text x="1056" y="800" text-anchor="end" font-size="16" font-weight="700" class="t">لهجه Premium — Gold (استفاده محدود)</text>
  <g>
    <rect x="824" y="816" width="232" height="100" rx="16" fill="#C8A951" class="card"/>
    <text x="1040" y="946" text-anchor="end" class="name">accent</text>
    <text x="1040" y="964" text-anchor="end" class="hex">#C8A951</text>

    <rect x="576" y="816" width="232" height="100" rx="16" fill="#A98937" class="card"/>
    <text x="792" y="946" text-anchor="end" class="name">accent-deep</text>
    <text x="792" y="964" text-anchor="end" class="hex">#A98937</text>

    <rect x="328" y="816" width="232" height="100" rx="16" fill="#EAF5FB" class="card"/>
    <text x="544" y="946" text-anchor="end" class="name">brand-soft</text>
    <text x="544" y="964" text-anchor="end" class="hex">#EAF5FB</text>

    <rect x="80" y="816" width="232" height="100" rx="16" fill="#064466" class="card"/>
    <text x="296" y="946" text-anchor="end" class="name">brand-active</text>
    <text x="296" y="964" text-anchor="end" class="hex">#064466</text>
  </g>

  <!-- ردیف ۵: معنایی -->
  <text x="1056" y="1020" text-anchor="end" font-size="16" font-weight="700" class="t">معنایی — Semantic</text>
  <g>
    <rect x="824" y="1036" width="232" height="100" rx="16" fill="#2D8A68" class="card"/>
    <text x="1040" y="1166" text-anchor="end" class="name">pine · Success</text>
    <text x="1040" y="1184" text-anchor="end" class="hex">#2D8A68</text>

    <rect x="576" y="1036" width="232" height="100" rx="16" fill="#D9822B" class="card"/>
    <text x="792" y="1166" text-anchor="end" class="name">ochre · Warning</text>
    <text x="792" y="1184" text-anchor="end" class="hex">#D9822B</text>

    <rect x="328" y="1036" width="232" height="100" rx="16" fill="#C0392B" class="card"/>
    <text x="544" y="1166" text-anchor="end" class="name">brick · Error</text>
    <text x="544" y="1184" text-anchor="end" class="hex">#C0392B</text>

    <rect x="80" y="1036" width="232" height="100" rx="16" fill="#247BA0" class="card"/>
    <text x="296" y="1166" text-anchor="end" class="name">slate · Info</text>
    <text x="296" y="1184" text-anchor="end" class="hex">#247BA0</text>
  </g>
</svg>
